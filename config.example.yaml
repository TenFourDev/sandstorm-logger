discordToken: '' # Optional
servers:
  - name: 'Main Server'
    logFilePath: '/app/logs/Insurgency.log'

    # Optional: broadcast join/leave messages on Discord channel, requires discordToken
    discordChannelId: '...'
    discordPlayerJoinFormat: '{name} joined the server'
    discordPlayerLeaveFormat: '{name} left the server'

    # Optional: broadcast join/leave messages in-game through RCON.
    rconHost: '127.0.0.1'
    rconPort: 27015
    rconPassword: 'your-rcon-password'
    inGamePlayerJoinFormat: '{name} joined the server'
    inGamePlayerLeaveFormat: '{name} left the server'

  
    # Optional: limit smoke projectiles per player per round (kick when exceeded).
    # Omit or set to null to disable smoke detection entirely.
    # requires rcon connection and some logging set to verbose on Engine.ini:
    # ```
    # [Core.Log]
    # LogSoldier=Verbose
    # LogSpawn=Verbose
    # LogGameMode=Verbose
    # ```
    smokeLimitPerRound: 10
    # Optional: only announce the running count from this throw onwards.
    # Omit or set to null to announce from the very first throw.
    smokeAnnounceThreshold: 8
